
name: download-net-file

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      file_url:
        description: '文件地址'
        required: true
      

env:
  UPLOAD_WENSHUSHU: false
  UPLOAD_COWTRANSFER: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        #sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        #sudo -E apt-get -qq update
        #sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004)
       
        #sudo -E apt-get -qq autoremove --purge
        #sudo -E apt-get -qq clean
        #sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Make dir download
      working-directory: /workdir
      run: |
        df -hT $PWD
        mkdir download
        ln -sf /workdir/download $GITHUB_WORKSPACE/download
        
    - name: Download files
      id: download
      run: |
        cd download
        file_url="${{ github.event.inputs.file_url }}"
        curl -OfsSL $file_url
        # echo "::set-output name=status::success"
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize files
      id: organize
      if: steps.download.outputs.status == 'success' && !cancelled()
      run: |
        cd download
        t=file_$(date +%Y%m%d%H%M%S).tar.gz
        echo "FILE_NAME=$t" >> $GITHUB_ENV
        tar -zcvf $t *
        # echo "::set-output name=status::success"
        echo "status=success" >> $GITHUB_OUTPUT
               
    - name: Upload firmware to CowTransfer 奶牛快传
      id: upload
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
      run: |
        cd download
        FILE=${{ env.FILE_NAME }}
        echo "Upload file: $FILE"
        # 第一步：获取上传token和上传地址
        TOKEN_RESP=$(curl -s -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" https://cowtransfer.com/api/upload/init)
        UPLOAD_URL=$(echo "$TOKEN_RESP" | jq -r '.uploadUrl')
        TRANSFER_ID=$(echo "$TOKEN_RESP" | jq -r '.transferId')
        echo "UPLOAD_URL: $UPLOAD_URL"
        echo "TRANSFER_ID: $TRANSFER_ID"
        # 第二步：上传文件
        curl -s -X POST -F "file=@${FILE}" "$UPLOAD_URL"
        # 拼接下载链接
        DOWNLOAD_URL="https://cowtransfer.com/s/${TRANSFER_ID}"
        echo "url=${DOWNLOAD_URL}" >> $GITHUB_OUTPUT
        echo "✅ 奶牛快传链接: ${DOWNLOAD_URL}"



        
    
